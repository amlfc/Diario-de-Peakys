<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Diario de Peakys</title>
    
    <!-- CSS Básico por si falla Tailwind -->
    <style>
        body { background-color: #0f172a; color: white; font-family: sans-serif; margin: 0; }
        #debug-console { display: none; background: #450a0a; color: #fecaca; padding: 20px; margin: 20px; border-radius: 8px; font-family: monospace; white-space: pre-wrap; }
        .loading-screen { position: fixed; top:0; left:0; width:100%; height:100%; background:#0f172a; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:9999; }
        .spinner { width: 40px; height: 40px; border: 4px solid #334155; border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        /* Tailwind CDN */
    </style>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- LIBRERÍAS CRÍTICAS (Usando UNPKG con versiones fijas para estabilidad) -->
    <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>
    
    <!-- Dexie (Base de Datos Local) -->
    <script src="https://unpkg.com/dexie@3.2.4/dist/dexie.min.js"></script>
    
    <!-- Gráficos y Excel (Opcionales, la app carga igual si fallan) -->
    <script src="https://unpkg.com/recharts@2.10.3/umd/Recharts.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>

    <!-- MANEJO DE ERRORES GLOBAL -->
    <script>
        window.onerror = function(msg, url, line, col, error) {
            const box = document.getElementById('debug-console');
            const loader = document.getElementById('loader');
            if (box && loader) {
                loader.style.display = 'none';
                box.style.display = 'block';
                box.innerHTML += `ERROR CRÍTICO:\n${msg}\nLínea: ${line}\n\nIntenta recargar la página o verifica tu conexión a internet para cargar las librerías iniciales.\n`;
            }
            return false;
        };
    </script>
</head>
<body>
    <div id="loader" class="loading-screen">
        <div class="spinner"></div>
        <p style="margin-top:20px; color:#94a3b8;">Cargando Diario de Peakys...</p>
        <small style="color:#475569; margin-top:10px;">Si no carga en 10 segundos, revisa tu conexión.</small>
    </div>

    <div id="debug-console"></div>
    <div id="root"></div>

    <script type="text/babel" data-presets="react">
        
        // --- VERIFICACIÓN DE DEPENDENCIAS ---
        const checkDeps = () => {
            if (!window.React || !window.ReactDOM || !window.Dexie) {
                throw new Error("Las librerías base (React o Dexie) no se han cargado. Revisa tu conexión a internet.");
            }
        };
        checkDeps();

        const { useState, useEffect, useRef, useMemo } = React;
        
        // Recharts seguro (si falla, no rompe la app, solo no muestra gráficos)
        const RechartsLib = window.Recharts || {};
        const { BarChart, Bar, XAxis, YAxis, Tooltip, ResponsiveContainer, CartesianGrid, PieChart, Pie, Cell, Legend } = RechartsLib;
        const hasCharts = !!window.Recharts;

        // --- 1. ICONOS INTEGRADOS (SVG PURO) ---
        const IconBase = ({ size = 20, className = "", children }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
        );

        const Icons = {
            Dashboard: (p) => <IconBase {...p}><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></IconBase>,
            Positions: (p) => <IconBase {...p}><path d="M12 3v18"/><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/></IconBase>,
            Transactions: (p) => <IconBase {...p}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></IconBase>,
            Analysis: (p) => <IconBase {...p}><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></IconBase>,
            Settings: (p) => <IconBase {...p}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.74v-.47a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></IconBase>,
            Mobile: (p) => <IconBase {...p}><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></IconBase>,
            Add: (p) => <IconBase {...p}><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/></IconBase>,
            Trash: (p) => <IconBase {...p}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></IconBase>,
            Wallet: (p) => <IconBase {...p}><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></IconBase>,
            Up: (p) => <IconBase {...p}><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></IconBase>,
            Down: (p) => <IconBase {...p}><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/></IconBase>,
            ArrowRight: (p) => <IconBase {...p}><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></IconBase>
        };

        // --- 2. MODELO DE DATOS ---

        const DefaultPortfolios = { Alejandro: 'Alejandro', Marta: 'Marta', Sara: 'Sara', Mama: 'Mama' };
        const DefaultAssetTypes = {
            ETFLong: 'ETF largo', ActionSwing: 'Acción swing', ActionLong: 'Acción largo',
            ActionPenny: 'Acción penny', Commodity: 'Materia prima', Crypto: 'Criptomonedas',
            FixedIncome: 'Renta fija', Unclassified: 'Sin Clasificar'
        };
        const Currency = { EUR: 'EUR', USD: 'USD', GBP: 'GBP', CHF: 'CHF', CAD: 'CAD', JPY: 'JPY', AUD: 'AUD', HKD: 'HKD' };
        const TransactionType = { Buy: 'Compra', Sell: 'Venta' };

        // --- 3. BASE DE DATOS (DEXIE) ---
        
        let db;
        try {
            db = new Dexie('PortfolioMasterDB');
            db.version(4).stores({
                transactions: '++id, portfolio, ticker, date, type',
                liquidity: '++id, portfolio, date',
                portfolios: '++id, name',
                assetTypes: '++id, name',
                allocationTargets: '++id, [portfolio+assetType]',
                dividends: null 
            });
        } catch(e) {
            console.error("Error DB", e);
            document.getElementById('debug-console').innerHTML += "Error iniciando Base de Datos: " + e.message;
        }

        const seedDatabase = async () => {
            try {
                const pc = await db.portfolios.count();
                if (pc === 0) await db.portfolios.bulkAdd(Object.values(DefaultPortfolios).map(name => ({name})));
                
                const ac = await db.assetTypes.count();
                if (ac === 0) await db.assetTypes.bulkAdd(Object.values(DefaultAssetTypes).map(name => ({name})));
            } catch (e) { console.error("Error seeding", e); }
        };

        // --- 4. SERVICIOS ---

        const FX_RATES = { 'USD': 0.94, 'EUR': 1.0, 'GBP': 1.15, 'CHF': 1.04, 'CAD': 0.68, 'JPY': 0.006 };
        let cachedPrices = {};
        let lastFetchTime = 0;

        const fetchPricesFromSheet = async () => {
            const rawUrl = localStorage.getItem('PRICE_FEED_URL');
            if (!rawUrl) return {};
            
            // Cache 1 min
            if (Date.now() - lastFetchTime < 60000 && Object.keys(cachedPrices).length > 0) return cachedPrices;

            const match = rawUrl.match(/\/d\/([a-zA-Z0-9-_]+)/);
            const csvUrl = match && match[1] ? `https://docs.google.com/spreadsheets/d/${match[1]}/export?format=csv` : rawUrl;

            try {
                const res = await fetch(csvUrl);
                if (!res.ok) throw new Error();
                const txt = await res.text();
                const newP = {};
                txt.split(/\r?\n/).forEach(l => {
                    const p = l.split(/[,;]/);
                    if (p.length >= 2) {
                        const t = p[0].replace(/['"]/g, '').trim().toUpperCase();
                        // Limpieza básica de números (soporta 1.200,50 y 1,200.50)
                        let vStr = p[1].replace(/['"]/g, '').trim();
                        let v = parseFloat(vStr); 
                        if (isNaN(v) || (vStr.includes(',') && !vStr.includes('.'))) {
                             v = parseFloat(vStr.replace(',', '.'));
                        }
                        if (t && !isNaN(v)) newP[t] = v;
                    }
                });
                cachedPrices = newP;
                lastFetchTime = Date.now();
                return newP;
            } catch(e) { return {}; }
        };

        const calculatePositionsAndMetrics = async (portfolio) => {
            let txs = [], liq = [];
            if (portfolio === 'ALL') {
                txs = await db.transactions.toArray();
                liq = await db.liquidity.toArray();
            } else {
                txs = await db.transactions.where('portfolio').equals(portfolio).toArray();
                liq = await db.liquidity.where('portfolio').equals(portfolio).toArray();
            }

            txs.sort((a, b) => new Date(a.date) - new Date(b.date));
            const posMap = new Map();

            txs.forEach(tx => {
                const k = `${tx.portfolio}-${tx.ticker}`;
                let p = posMap.get(k);
                if (!p) {
                    p = {
                        ticker: tx.ticker, assetName: tx.assetName, portfolio: tx.portfolio, assetType: tx.assetType,
                        currencyPlatform: tx.currencyPlatform, quantity: 0, avgPricePlatform: 0, avgPriceEur: 0, realizedPnLEur: 0, avgFxRate: 0
                    };
                }
                
                if (tx.type === TransactionType.Buy) {
                    const costOld = p.quantity * p.avgPricePlatform;
                    const costNew = tx.quantity * tx.price;
                    const newQ = p.quantity + tx.quantity;
                    if (newQ > 0) {
                        p.avgPricePlatform = (costOld + costNew) / newQ;
                        const weightedFx = (p.avgFxRate * costOld + tx.fxRateToEur * costNew);
                        p.avgFxRate = weightedFx / (costOld + costNew) || tx.fxRateToEur;
                        p.avgPriceEur = p.avgPricePlatform * p.avgFxRate;
                        p.quantity = newQ;
                    }
                } else {
                    const sellVal = (tx.quantity * tx.price * tx.fxRateToEur) - (Math.abs(tx.commission) * tx.fxRateToEur);
                    const costVal = tx.quantity * p.avgPriceEur;
                    p.realizedPnLEur += (sellVal - costVal);
                    p.quantity -= tx.quantity;
                }
                posMap.set(k, p);
            });

            await fetchPricesFromSheet();
            
            const active = [];
            const dash = { totalValueEur: 0, totalCostEur: 0, unrealizedPnLEur: 0, unrealizedPnLPct: 0, realizedPnLEur: 0, totalLiquidityAddedEur: 0, totalReturnPct: 0, projectedCloseEur: 0 };

            for (const p of posMap.values()) {
                const live = cachedPrices[p.ticker] || 0; // Si no hay live, usamos 0 o mock
                const fx = FX_RATES[p.currencyPlatform] || 1;
                
                // Solo calculamos valor actual si tenemos precio (o usamos precio compra como fallback temporal visual)
                const currentPrice = live > 0 ? live : p.avgPricePlatform;
                
                if (p.quantity > 0.0001) {
                    p.currentValueEur = p.quantity * currentPrice * fx;
                    p.totalCostEur = p.quantity * p.avgPriceEur;
                    p.unrealizedPnLEur = p.currentValueEur - p.totalCostEur;
                    
                    active.push(p);
                    dash.totalValueEur += p.currentValueEur;
                    dash.totalCostEur += p.totalCostEur;
                    dash.unrealizedPnLEur += p.unrealizedPnLEur;
                }
                dash.realizedPnLEur += p.realizedPnLEur;
            }

            dash.totalLiquidityAddedEur = liq.reduce((a, b) => a + b.amountEur, 0);
            dash.unrealizedPnLPct = dash.totalCostEur ? dash.unrealizedPnLEur / dash.totalCostEur : 0;
            if (dash.totalLiquidityAddedEur > 0) {
                const gain = (dash.totalValueEur + dash.realizedPnLEur) - dash.totalLiquidityAddedEur;
                dash.totalReturnPct = gain / dash.totalLiquidityAddedEur;
            }
            dash.projectedCloseEur = dash.totalValueEur + dash.realizedPnLEur;

            return { activePositions: active, dashboard: dash };
        };

        // --- 5. COMPONENTES UI ---

        const Card = ({title, children, className=""}) => (
            <div className={`bg-slate-800 border border-slate-700 rounded-xl shadow-sm overflow-hidden ${className}`}>
                {title && <div className="px-6 py-4 border-b border-slate-700"><h3 className="text-lg font-medium text-slate-100">{title}</h3></div>}
                <div className="p-6">{children}</div>
            </div>
        );

        const StatCard = ({title, value, sub, trend, icon: Icon}) => (
            <div className="bg-slate-800 border border-slate-700 rounded-xl p-5 flex justify-between hover:border-slate-600 transition-colors">
                <div>
                    <p className="text-sm font-medium text-slate-400 mb-1">{title}</p>
                    <h4 className="text-2xl font-bold text-white">{value}</h4>
                    {sub && <p className={`text-xs font-medium mt-2 ${trend==='up'?'text-emerald-400':trend==='down'?'text-rose-400':'text-slate-400'}`}>{sub}</p>}
                </div>
                {Icon && <div className="p-2 bg-slate-700/50 rounded-lg text-slate-300 h-fit"><Icon size={20}/></div>}
            </div>
        );

        // --- VISTAS ---

        const Dashboard = ({ m, p }) => {
            const fmt = (v) => new Intl.NumberFormat('es-ES', {style:'currency', currency:'EUR'}).format(v);
            const pct = (v) => new Intl.NumberFormat('es-ES', {style:'percent', minimumFractionDigits:2}).format(v);

            return (
                <div className="space-y-6 fade-in">
                    <h2 className="text-2xl font-bold text-white">Resumen: <span className="text-blue-400">{p==='ALL'?'Global':p}</span></h2>
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <StatCard title="Valor Total" value={fmt(m.totalValueEur)} sub={`${fmt(m.unrealizedPnLEur)} (${pct(m.unrealizedPnLPct)})`} trend={m.unrealizedPnLEur>=0?'up':'down'} icon={Icons.Wallet}/>
                        <StatCard title="Invertido" value={fmt(m.totalCostEur)} sub={`Aportado: ${fmt(m.totalLiquidityAddedEur)}`} icon={Icons.ArrowRight}/>
                        <StatCard title="G/P Cerrada" value={fmt(m.realizedPnLEur)} sub="Realizado" trend={m.realizedPnLEur>=0?'up':'down'} icon={Icons.Transactions}/>
                        <StatCard title="Rentabilidad" value={pct(m.totalReturnPct)} sub="Total" trend={m.totalReturnPct>=0?'up':'down'} icon={Icons.Analysis}/>
                    </div>
                    
                    {/* Fallback si fallan gráficos */}
                    {hasCharts ? (
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                         <Card title="Distribución" className="lg:col-span-2 h-80">
                             <ResponsiveContainer width="100%" height="100%">
                                 <BarChart data={[{name:'Coste',v:m.totalCostEur},{name:'Valor',v:m.totalValueEur},{name:'Cierre',v:m.projectedCloseEur}]} layout="vertical" margin={{left:10,right:30}}>
                                     <CartesianGrid strokeDasharray="3 3" stroke="#334155" horizontal={false}/>
                                     <XAxis type="number" hide/><YAxis dataKey="name" type="category" width={60} tick={{fill:'#94a3b8'}}/>
                                     <Tooltip contentStyle={{backgroundColor:'#1e293b', borderColor:'#334155', color:'#f1f5f9'}} formatter={fmt}/>
                                     <Bar dataKey="v" fill="#3b82f6" radius={[0,4,4,0]} barSize={30}/>
                                 </BarChart>
                             </ResponsiveContainer>
                         </Card>
                         <Card title="Cierre Estimado">
                             <div className="text-center py-8">
                                 <p className="text-sm text-slate-400">Si vendieras todo hoy</p>
                                 <p className="text-3xl font-bold text-emerald-400 mt-2">{fmt(m.projectedCloseEur)}</p>
                             </div>
                         </Card>
                    </div>
                    ) : (
                        <div className="p-4 bg-yellow-900/20 border border-yellow-900/50 text-yellow-200 rounded">
                            Los gráficos no se pudieron cargar (problema de internet), pero los datos están seguros.
                        </div>
                    )}
                </div>
            );
        };

        const PositionsTable = ({ pos }) => {
            const fmt = (v, c='EUR') => new Intl.NumberFormat('es-ES', {style:'currency', currency:c}).format(v);
            const sorted = [...pos].sort((a,b) => b.currentValueEur - a.currentValueEur);
            
            return (
                <div className="bg-slate-800 border border-slate-700 rounded-xl overflow-hidden shadow-sm fade-in">
                    <div className="px-6 py-4 border-b border-slate-700"><h3 className="text-lg font-medium text-slate-100 flex gap-2"><Icons.Positions size={18}/> Posiciones</h3></div>
                    <div className="overflow-x-auto">
                        <table className="w-full text-sm text-left">
                            <thead className="text-xs text-slate-400 uppercase bg-slate-900/50">
                                <tr><th className="px-6 py-3">Ticker</th><th className="px-6 py-3">Activo</th><th className="px-6 py-3">Cartera</th><th className="text-right px-6">Cant</th><th className="text-right px-6">Valor (EUR)</th><th className="text-right px-6">G/P</th></tr>
                            </thead>
                            <tbody className="divide-y divide-slate-700">
                                {sorted.map((p, i) => (
                                    <tr key={i} className="hover:bg-slate-700/30">
                                        <td className="px-6 py-4 font-medium text-white">{p.ticker}</td>
                                        <td className="px-6 py-4 text-slate-300">{p.assetName}</td>
                                        <td className="px-6 py-4 text-slate-400">{p.portfolio}</td>
                                        <td className="px-6 py-4 text-right">{p.quantity.toFixed(2)}</td>
                                        <td className="px-6 py-4 text-right font-bold text-white">{fmt(p.currentValueEur)}</td>
                                        <td className={`px-6 py-4 text-right ${p.unrealizedPnLEur>=0?'text-emerald-400':'text-rose-400'}`}>{fmt(p.unrealizedPnLEur)}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        const Diversification = ({ pos, m, p }) => {
            const [targets, setTargets] = useState([]);
            const [allAssets, setAllAssets] = useState([]);
            
            useEffect(() => {
                db.assetTypes.toArray().then(setAllAssets);
                const q = p === 'ALL' ? db.allocationTargets : db.allocationTargets.where('portfolio').equals(p);
                q.toArray().then(setTargets);
            }, [p]);

            // En esta pantalla (Diversificación) mostramos "Invertido" (coste) y no "Valor actual".
            const vals = new Map();
            pos.forEach(x => vals.set(x.assetType, (vals.get(x.assetType)||0) + x.totalCostEur));
            const data = Array.from(vals.entries()).map(([name, value]) => ({name, value})).sort((a,b) => b.value - a.value);
            
            const refCap = m.totalLiquidityAddedEur + m.realizedPnLEur;
            const fmt = (v) => new Intl.NumberFormat('es-ES', {style:'currency', currency:'EUR', maximumFractionDigits:0}).format(v);
            const COLORS = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6'];
            const uniqueTypes = [...new Set([...allAssets.map(a=>a.name), ...vals.keys()])].sort();

            const saveTarget = async (type, val) => {
                if (p === 'ALL') return;
                const v = parseFloat(val); if (isNaN(v)) return;
                const ex = targets.find(t => t.assetType === type);
                if(ex) await db.allocationTargets.update(ex.id, {targetPercentage: v});
                else await db.allocationTargets.add({portfolio: p, assetType: type, targetPercentage: v});
                db.allocationTargets.where('portfolio').equals(p).toArray().then(setTargets);
            };

            return (
                <Card title={`Diversificación: ${p === 'ALL' ? 'Global' : p}`} className="fade-in h-full">
                    <div className="flex flex-col xl:flex-row gap-8">
                        <div className="w-full xl:w-1/3 h-64">
                            {hasCharts && (
                            <ResponsiveContainer>
                                <PieChart>
                                    <Pie data={data} innerRadius={60} outerRadius={80} paddingAngle={5} dataKey="value">
                                        {data.map((e,i) => <Cell key={i} fill={COLORS[i%COLORS.length]} stroke="#1e293b"/>)}
                                    </Pie>
                                    <Tooltip contentStyle={{backgroundColor:'#1e293b'}} formatter={fmt}/>
                                </PieChart>
                            </ResponsiveContainer>
                            )}
                            <div className="text-center text-xs text-slate-500 mt-2">Capital Ref: {fmt(refCap)}</div>
                        </div>
                        <div className="w-full xl:w-2/3 overflow-x-auto">
                            <table className="w-full text-sm text-left">
                                <thead className="text-xs text-slate-400 uppercase border-b border-slate-700">
                                    <tr>
                                      <th>Tipo</th>
                                      <th className="text-right">Invertido €</th>
                                      <th className="text-right">Invertido %</th>
                                      <th className="text-center">Obj %</th>
                                      <th className="text-center">Estado</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-700">
                                    {uniqueTypes.map(type => {
                                        const val = vals.get(type)||0;
                                        const pct = refCap > 0 ? (val/refCap)*100 : 0;
                                        const tgt = p === 'ALL' ? 0 : (targets.find(t=>t.assetType===type)?.targetPercentage||0);
                                        const tgtVal = refCap * (tgt/100);
                                        
                                        let color = 'text-slate-500', text = '-';
                                        if (tgtVal > 0) {
                                            const r = val / tgtVal;
                                            if (r < 0.9) { color = 'text-blue-400 font-bold'; text = 'COMPRAR'; }
                                            else if (r > 1.1) { color = 'text-rose-400 font-bold'; text = 'VENDER'; }
                                            else { color = 'text-emerald-400 font-bold'; text = 'OK'; }
                                        }

                                        return (
                                            <tr key={type}>
                                                <td className="px-4 py-2 text-slate-200">{type}</td>
                                                <td className="px-4 py-2 text-right">{fmt(val)}</td>
                                                <td className="px-4 py-2 text-right">{pct.toFixed(1)}%</td>
                                                <td className="px-4 py-2 text-center">
                                                    {p !== 'ALL' ? 
                                                        <input type="number" className="w-12 bg-slate-900 border border-slate-600 rounded text-center text-white text-xs" value={tgt||''} onChange={e=>saveTarget(type, e.target.value)}/> 
                                                    : '-'}
                                                </td>
                                                <td className={`px-4 py-2 text-center ${color} text-xs`}>{text}</td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </Card>
            );
        };

        const SettingsView = () => {
            const [url, setUrl] = useState(localStorage.getItem('PRICE_FEED_URL')||'');
            const fileRef = useRef();

            const saveUrl = () => { localStorage.setItem('PRICE_FEED_URL', url); alert('Guardado. Recarga para ver precios.'); };
            
            const onImport = async (e) => {
                const file = e.target.files[0];
                if (!file || !window.XLSX) return;
                
                const reader = new FileReader();
                reader.onload = async (evt) => {
                    try {
                        const wb = XLSX.read(evt.target.result, {type:'binary', cellDates:true});
                        const sn = wb.SheetNames.find(n => n.toLowerCase().includes('transac')) || wb.SheetNames[0];
                        const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn]);
                        
                        const txs = [];
                        for (const row of rows) {
                            if (!row['Ticker'] && !row['ticker']) continue;
                            // Mapeo básico para demo
                            const typeStr = (row['Tipo']||'').toString().toLowerCase();
                            const type = typeStr.includes('venta') ? TransactionType.Sell : TransactionType.Buy;
                            txs.push({
                                date: new Date().toISOString().split('T')[0], // Simplificado
                                portfolio: (row['Cartera']||'Alejandro').toString(),
                                type, ticker: (row['Ticker']||'').toString().toUpperCase(),
                                assetName: (row['Nombre Activo']||'').toString(),
                                assetType: DefaultAssetTypes.ActionLong,
                                quantity: Number(row['Cantidad']||0), price: Number(row['Precio']||0),
                                commission: Number(row['Comisión']||0), currencyPlatform: Currency.EUR, fxRateToEur: 1
                            });
                        }
                        if (txs.length) {
                            await db.transactions.bulkAdd(txs);
                            alert('Importado con éxito'); window.location.reload();
                        }
                    } catch(err) { alert('Error importando'); }
                };
                reader.readAsBinaryString(file);
            };

            const reset = async () => { if(confirm('¿Borrar todo?')) { await db.delete(); window.location.reload(); } };

            return (
                <div className="space-y-6 fade-in">
                    <h2 className="text-2xl font-bold text-white flex gap-2"><Icons.Settings/> Configuración</h2>
                    <Card title="Precios en Vivo">
                        <div className="flex gap-2">
                            <input value={url} onChange={e=>setUrl(e.target.value)} className="flex-1 bg-slate-900 border border-slate-700 p-2 text-white text-sm rounded" placeholder="URL Google Sheets..."/>
                            <button onClick={saveUrl} className="bg-blue-600 px-4 py-2 text-white text-sm rounded">Guardar</button>
                        </div>
                    </Card>
                    <Card title="Importar / Borrar">
                        <div className="flex gap-4">
                            <input type="file" ref={fileRef} className="hidden" onChange={onImport} accept=".xlsx"/>
                            <button onClick={()=>fileRef.current.click()} className="bg-emerald-600 px-4 py-2 rounded text-white">Importar Excel</button>
                            <button onClick={reset} className="bg-rose-900/50 text-rose-200 px-4 py-2 rounded">Reset Fábrica</button>
                        </div>
                    </Card>
                </div>
            );
        };

        // --- APP PRINCIPAL ---

        const App = () => {
            const [tab, setTab] = useState('dashboard');
            const [portfolio, setPortfolio] = useState('ALL');
            const [portfolios, setPortfolios] = useState([]);
            const [data, setData] = useState({activePositions:[], dashboard:{}});

            useEffect(() => {
                seedDatabase().then(() => {
                    db.portfolios.toArray().then(setPortfolios);
                    load();
                });
                const i = setInterval(load, 5000);
                // Eliminar pantalla de carga cuando React monta
                const l = document.getElementById('loader'); if(l) l.style.display='none';
                return () => clearInterval(i);
            }, [portfolio]);

            const load = async () => {
                const d = await calculatePositionsAndMetrics(portfolio);
                setData(d);
            };

            const NavBtn = ({id, icon, label}) => (
                <button onClick={()=>setTab(id)} className={`w-full flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-lg transition-all ${tab===id?'bg-blue-600 text-white shadow-lg':'text-slate-400 hover:bg-slate-800'}`}>
                    {icon} <span>{label}</span>
                </button>
            );

            return (
                <div className="flex h-screen bg-slate-900 overflow-hidden">
                    <aside className="w-64 bg-slate-900 border-r border-slate-800 hidden md:flex flex-col">
                        <div className="p-6 border-b border-slate-800"><h1 className="text-xl font-bold text-white flex items-center gap-2"><Icons.Settings className="text-blue-500"/> Diario Peakys</h1></div>
                        <div className="p-4 space-y-2 flex-1">
                            <NavBtn id="dashboard" icon={<Icons.Dashboard/>} label="Dashboard"/>
                            <NavBtn id="positions" icon={<Icons.Positions/>} label="Posiciones"/>
                            <NavBtn id="analysis" icon={<Icons.Analysis/>} label="Diversificación"/>
                            <NavBtn id="settings" icon={<Icons.Settings/>} label="Configuración"/>
                        </div>
                    </aside>
                    <main className="flex-1 flex flex-col overflow-hidden">
                        <header className="h-16 border-b border-slate-800 bg-slate-900/90 backdrop-blur flex items-center justify-between px-6">
                            <select value={portfolio} onChange={e=>setPortfolio(e.target.value)} className="bg-slate-800 text-white text-sm rounded border border-slate-700 p-2 outline-none">
                                <option value="ALL">Global (Todas)</option>
                                {portfolios.map(p=><option key={p.id} value={p.name}>{p.name}</option>)}
                            </select>
                        </header>
                        <div className="flex-1 overflow-y-auto p-4 md:p-8 scroll-smooth">
                            <div className="max-w-7xl mx-auto">
                                {tab === 'dashboard' && data.dashboard.totalValueEur !== undefined && (
                                    <>
                                        <Dashboard m={data.dashboard} p={portfolio}/>
                                        <div className="mt-8 grid grid-cols-1 xl:grid-cols-2 gap-6">
                                            <PositionsTable pos={data.activePositions.slice(0,5)}/>
                                            <Diversification pos={data.activePositions} m={data.dashboard} p={portfolio}/>
                                        </div>
                                    </>
                                )}
                                {tab === 'positions' && <PositionsTable pos={data.activePositions}/>}
                                {tab === 'analysis' && <Diversification pos={data.activePositions} m={data.dashboard} p={portfolio}/>}
                                {tab === 'settings' && <SettingsView/>}
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App/>);

    </script>
</body>
</html>
